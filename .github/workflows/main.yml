name: Manual - Deployment (Dynamic Delta)
 
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual Sync from QA'

      branchFrom: 
        description: 'Which branch do we deploy from?' 
        required: true
        type: choice
        options: 
           - QA
           - SIT
           - UAT
           - FTNEXCELL
           - PREPROD

      branchTo: 
        description: 'Branch where to deploy' 
        required: true
        type: choice
        options: 
            - QA
            - SIT
            - UAT
            - FTNEXCELL
            - PREPROD
            
      pr_titles:
        description: 'Paste PR Titles separated by commas (e.g., Fix Bug A, Update Class B)'
        required: false
        type: string 

      Comment: 
        description: 'Comment Message'
        required: false
        default: ''
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '23'
 
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version
          sf plugins --core
 
      - name: Install SFDX Git Delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate ${{ github.event.inputs.branchTo }} Org
        run: |
          echo "${{ secrets[format('{0}_AUTH_URL', github.event.inputs.branchTo)] }}" > auth_to_url.txt
          sf org login sfdx-url --sfdx-url-file auth_to_url.txt --set-default --alias "${{ github.event.inputs.branchTo }}"
          rm auth_to_url.txt

      - name: Authenticate ${{ github.event.inputs.branchFrom }} Org
        run: |
          echo "${{ secrets[format('{0}_AUTH_URL', github.event.inputs.branchFrom)] }}" > auth_from_url.txt
          sf org login sfdx-url --sfdx-url-file auth_from_url.txt --alias "${{ github.event.inputs.branchFrom }}"
          rm auth_from_url.txt
 
      - name: Isolate Specific PR Changes and Validate
        run: |
          mkdir -p staging_source
          mkdir -p manifests/delta
          
          BRANCH_TO_LOWER=$(echo "${{ github.event.inputs.branchTo }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_FROM_LOWER=$(echo "${{ github.event.inputs.branchFrom }}" | tr '[:upper:]' '[:lower:]')
          
          # Explicitly track and fetch the full history for both target branches
          git remote set-branches origin "$BRANCH_FROM_LOWER" "$BRANCH_TO_LOWER"
          git fetch --prune origin "$BRANCH_FROM_LOWER" "$BRANCH_TO_LOWER"
          
          git checkout -f "$BRANCH_TO_LOWER"

          
          RAW_INPUT="${{ github.event.inputs.pr_titles }}"
          echo "Processing combined inputs..."
          
          IFS=',' read -ra TITLES <<< "$RAW_INPUT"
          FOUND_ANY_COMMIT=false
          
          for TITLE in "${TITLES[@]}"; do
            TITLE=$(echo "$TITLE" | xargs)
            if [ -z "$TITLE" ]; then
              continue
            fi
            
            echo "----------------------------------------"
            echo "🔍 Searching for PR Title: '$TITLE'"
            
            COMMIT_HASH=$(git log --all --grep="$TITLE" --format="%H" -n 1)
            
            if [ -z "$COMMIT_HASH" ]; then
              echo "❌ Error: Could not find any commit matching title '$TITLE'"
              continue
            fi
            
            echo "✅ Found commit hash: $COMMIT_HASH"
            FOUND_ANY_COMMIT=true
          
            PARENT_COUNT=$(git rev-list --parents -n 1 "$COMMIT_HASH" | wc -w)
            
            if [ "$PARENT_COUNT" -gt 2 ]; then
              echo "🔀 Merge commit detected. Diffing relative to BranchTo mainline (^1)..."
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$COMMIT_HASH^1" "$COMMIT_HASH")
            else
              echo "📄 Regular commit detected. Diffing against its direct parent..."
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$COMMIT_HASH")
            fi
            
            echo "$CHANGED_FILES" | while read -r FILE; do
              if [ -z "$FILE" ]; then continue; fi
              
              if [ -f "$FILE" ]; then
                mkdir -p "staging_source/$(dirname "$FILE")"
                cp "$FILE" "staging_source/$FILE"
                echo "📦 Staged: $FILE"
                
                if [ -f "${FILE}-meta.xml" ]; then
                  cp "${FILE}-meta.xml" "staging_source/${FILE}-meta.xml"
                  echo "📦 Staged: ${FILE}-meta.xml"
                fi
              fi
            done
          done
          
          echo "----------------------------------------"
          # FIXED: Mutually exclusive routing prevents files from wiping out branch comparison results
          if [ "$FOUND_ANY_COMMIT" = false ]; then
            echo "🌿 No manual PR titles provided. Comparing full branches..."
            
            # 3. Print actual differences directly to the log to debug Git's visibility
            echo "--- Debugging Git Diff output directly ---"
            git diff --name-status "origin/$BRANCH_FROM_LOWER"..."origin/$BRANCH_TO_LOWER"
            echo "----------------------------------------"
            
            # 4. Use the triple-dot syntax to find changes introduced in FROM that are not in TO
            sf sgd source delta --from "origin/$BRANCH_FROM_LOWER" --to "origin/$BRANCH_TO_LOWER" --output-dir manifests/delta/ --generate-delta          
          else
            echo "🚀 PR Titles found! Generating Delta Manifest From Staged Files Only..."
            sf sgd source delta --from "origin/$BRANCH_FROM_LOWER" --to "origin/$BRANCH_TO_LOWER" --source-dir staging_source --output-dir manifests/delta/ --generate-delta
          fi
          
          CURRENT_FILENAME="$(date +'%Y-%m-%d')_package.xml"
          FILE_PATH="manifests/delta/package/${CURRENT_FILENAME}"
          
          if [ ! -f "manifests/delta/package/package.xml" ]; then
             echo "❌ Error: package.xml could not be generated."
             exit 1
          fi
          
          echo "Moving package.xml to: ${FILE_PATH}"
          mv manifests/delta/package/package.xml "${FILE_PATH}"
          
          echo "Content of generated package manifest:"
          cat "${FILE_PATH}"
          
          if grep -q "<types>" "${FILE_PATH}"; then
            echo "🚀 Changes detected! Proceeding with Salesforce validation..."
            sf project deploy validate \
              --manifests/delta/package.xml \
              --target-org "${{ github.event.inputs.branchTo }}" \
              --wait 30 \
              --test-level RunLocalTests
          else
            echo "✅ No local changes or branch differences found to deploy. Skipping validation step safely!"
          fi

