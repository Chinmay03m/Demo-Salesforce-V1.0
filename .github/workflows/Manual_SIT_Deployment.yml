name: Manual SIT Deployment (Dynamic Delta)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual Sync from QA'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global
          sf version

      - name: Install SFDX Git Delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate SIT Org
        run: |
          # Ensure you have SIT_AUTH_URL stored in your GitHub Secrets
          echo "${{ secrets.SIT_AUTH_URL }}" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --set-default --alias sit_org

      - name: Generate Delta Manifest
        run: |
          
          git fetch origin v2vqa v2vsit
          
          
          mkdir delta-output
          
          
          # --to: The source branch (v2vqa)
          # --from: The target branch (v2vsit)
          sf sgd:source:delta --to origin/v2vqa --from origin/v2vsit --output delta-output/
          
         
          echo "--- Generated package.xml ---"
          cat delta-output/package/package.xml

      - name: Validate to SIT
        run: |
          # Deploys only the components listed in the generated manifest
          sf project deploy validate \
            --manifest delta-output/package/package.xml \
            --target-org sit_org \
            --wait 30 \
            --test-level RunLocalTests
